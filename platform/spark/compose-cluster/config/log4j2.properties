status = warn
name = StratusSparkRuntime

property.stratusLevel = ${env:STRATUS_LOG_LEVEL:-INFO}
property.pattern = %d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}{UTC} %-5level [%t] %logger suiteRunId=%X{suiteRunId} jobRunId=%X{jobRunId} operationId=%X{operationId} %msg%n%throwable

appender.console.type = Console
appender.console.name = Console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = ${pattern}

rootLogger.level = info
rootLogger.appenderRef.console.ref = Console

logger.stratus.name = dev.stratus
logger.stratus.level = ${stratusLevel}
logger.stratus.additivity = false
logger.stratus.appenderRef.console.ref = Console

logger.jetty.name = org.eclipse.jetty
logger.jetty.level = warn
logger.netty.name = io.netty
logger.netty.level = warn
logger.aws.name = software.amazon.awssdk
logger.aws.level = warn
logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = warn
