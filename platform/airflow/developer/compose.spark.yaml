# P1-4.2-D1 development-only overlay. The Airflow scheduler joins the provider-owned
# Ceph network so its Spark driver can reach the standalone master and executors.
# Provider paths and the network name are supplied by airflow-spark-common.sh.
services:
  # Airflow 3 parses and serializes DAG default_args in this separate service. Expected-failure
  # live proofs therefore have to place their bounded retry overrides here as well as on the
  # scheduler that executes the resulting task instances.
  airflow-dag-processor:
    environment:
      STRATUS_DISABLE_DAG_SCHEDULES: ${STRATUS_DISABLE_DAG_SCHEDULES:-false}
      STRATUS_BRONZE_TO_SILVER_RETRIES: ${STRATUS_BRONZE_TO_SILVER_RETRIES:-2}
      STRATUS_SILVER_TO_GOLD_RETRIES: ${STRATUS_SILVER_TO_GOLD_RETRIES:-2}

  airflow-scheduler:
    environment:
      SPARK_CONF_DIR: /opt/stratus/spark-conf
      STRATUS_RUN_ID: ${STRATUS_RUN_ID:-unscoped-airflow-spark-run}
      STRATUS_LOG_LEVEL: ${STRATUS_LOG_LEVEL:-DEBUG}
      STRATUS_DISABLE_DAG_SCHEDULES: ${STRATUS_DISABLE_DAG_SCHEDULES:-false}
      # Environment-backed connections avoid storing developer credentials in the metadata
      # database and avoid repeated Airflow CLI startup during focused live tests.
      AIRFLOW_CONN_SPARK_DEFAULT: >-
        {"conn_type":"spark","host":"spark://spark-master.stratus.local","port":7077}
      AIRFLOW_CONN_STRATUS_LANDING: >-
        {"conn_type":"aws","login":"${AIRFLOW_LANDING_RGW_ACCESS_KEY:?Airflow landing RGW access key is required}","password":"${AIRFLOW_LANDING_RGW_SECRET_KEY:?Airflow landing RGW secret key is required}","extra":{"endpoint_url":"${CEPH_RGW_ENDPOINT:?Ceph RGW endpoint is required}","verify":"/opt/stratus/certs/stratus-ca.crt","config_kwargs":{"s3":{"addressing_style":"path"}}}}
      AIRFLOW_VAR_STRATUS_LANDING_BUCKET: stratus-landing
      # The blocked-path harness sets this to zero so a deliberately refused promotion does not
      # wait through normal retry delays. Unset development runs retain the DAG's default of two.
      STRATUS_BRONZE_TO_SILVER_RETRIES: ${STRATUS_BRONZE_TO_SILVER_RETRIES:-2}
      # Expected blocked-path tests set zero; normal developer executions keep two retries.
      STRATUS_SILVER_TO_GOLD_RETRIES: ${STRATUS_SILVER_TO_GOLD_RETRIES:-2}
      # Pulled from OpenBao by the test harness. The values are never tracked,
      # written to the Airflow metadata database, or passed as spark-submit args.
      AWS_ACCESS_KEY_ID: ${AIRFLOW_SPARK_RGW_ACCESS_KEY:?Spark RGW access key is required}
      AWS_SECRET_ACCESS_KEY: ${AIRFLOW_SPARK_RGW_SECRET_KEY:?Spark RGW secret key is required}
      AWS_REGION: ${CEPH_RGW_REGION:-default}
      AWS_CA_BUNDLE: /opt/stratus/certs/stratus-ca.crt
      CEPH_RGW_ENDPOINT: ${CEPH_RGW_ENDPOINT:?Ceph RGW endpoint is required}
      AIRFLOW_LANDING_RGW_ACCESS_KEY: ${AIRFLOW_LANDING_RGW_ACCESS_KEY:?Airflow landing RGW access key is required}
      AIRFLOW_LANDING_RGW_SECRET_KEY: ${AIRFLOW_LANDING_RGW_SECRET_KEY:?Airflow landing RGW secret key is required}
    volumes:
      - ${AIRFLOW_SPARK_DEFAULTS_FILE:?Spark defaults file is required}:/opt/stratus/spark-conf/spark-defaults.conf:ro
      - ${AIRFLOW_SPARK_LOG4J_FILE:?Spark Log4j2 configuration is required}:/opt/stratus/spark-conf/log4j2.properties:ro
      - ${AIRFLOW_SPARK_TRUSTSTORE_FILE:?Spark truststore is required}:/opt/stratus/certs/stratus-truststore.jks:ro
      - ${AIRFLOW_CEPH_CA_CERT:?Ceph CA certificate is required}:/opt/stratus/certs/stratus-ca.crt:ro
      - ${AIRFLOW_SPARK_JOBS_JAR:?Spark jobs JAR is required}:/opt/stratus/jobs/stratus-spark-jobs.jar:ro
      - ${AIRFLOW_ICEBERG_RUNTIME_JAR:?Locked Iceberg driver runtime is required}:/opt/stratus/runtime/stratus-iceberg-aws-runtime.jar:ro
      - ${AIRFLOW_HADOOP_AWS_JAR:?Locked Hadoop AWS runtime is required}:/opt/stratus/runtime/hadoop-aws.jar:ro
      - ${AIRFLOW_AWS_SDK_BUNDLE_JAR:?Locked AWS SDK bundle is required}:/opt/stratus/runtime/aws-sdk-bundle.jar:ro
      - ${AIRFLOW_S3_ACCELERATOR_JAR:?Locked S3 accelerator runtime is required}:/opt/stratus/runtime/analyticsaccelerator-s3.jar:ro
      - ${AIRFLOW_AWS_BUNDLE_LOGGING_BRIDGE_JAR:?AWS bundle logging bridge is required}:/opt/stratus/runtime/log4j-slf4j-impl.jar:ro
      - ${AIRFLOW_TEST_SCRIPTS_DIR:?Airflow test scripts directory is required}:/opt/stratus/airflow-tests:ro
    networks:
      default:
      ceph:
        aliases:
          - airflow-scheduler.stratus.local

networks:
  ceph:
    external: true
    name: ${CEPH_HARNESS_NETWORK:?Ceph harness network is required}
