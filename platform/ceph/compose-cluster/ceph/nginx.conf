events {}

http {
    access_log /dev/stdout;
    error_log /dev/stderr notice;

    # Shared TLS settings for both published endpoints (S3 and dashboard).
    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    upstream ceph_rgw {
        least_conn;
        server rgw1:8080 max_fails=2 fail_timeout=5s;
        server rgw2:8080 max_fails=2 fail_timeout=5s;
    }

    # The dashboard is served only by the active manager; the standby answers
    # HTTP 500 (mgr/dashboard/standby_behaviour=error), so retrying on
    # http_500 always lands the request on the active one.
    #
    # max_fails=0 disables passive health marking here, and that is required
    # rather than incidental. With failure counting on, the standby's by-design
    # 500 counts against it, and any genuine 500 from the active manager counts
    # against that one too; once both are marked down nginx stops trying either
    # and answers 502 to everything, including endpoints that work. Observed on
    # 2026-08-05: a dashboard RGW error after secret rotation put the whole
    # dashboard API into 502 for over 90 seconds while both managers were
    # serving normally when probed directly, and continued retries kept
    # re-tripping the marking so it never recovered. Failover here comes from
    # proxy_next_upstream, which does not need the servers marked down; leaving
    # the marking on only lets one application error disable a live backend.
    # The RGW pool above keeps its passive checks: those are independent
    # gateways where a genuinely dead daemon must be taken out of rotation.
    upstream ceph_dashboard {
        server mgr1:8500 max_fails=0;
        server mgr2:8500 max_fails=0;
    }

    server {
        listen 8443 ssl;
        server_name object-store.stratus.local;

        client_max_body_size 0;
        # Generous upstream timeouts so long multipart part uploads and large
        # GETs are not cut off at the 60s nginx defaults.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass_request_headers on;

        location / {
            proxy_pass http://ceph_rgw;
        }
    }

    server {
        listen 8444 ssl;
        server_name object-store.stratus.local;

        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        location / {
            proxy_pass http://ceph_dashboard;
            # non_idempotent: POSTs must also fail over, because the standby
            # manager answers every request with 500 and no side effects.
            proxy_next_upstream error timeout http_500 http_502 http_503 non_idempotent;
        }
    }
}
