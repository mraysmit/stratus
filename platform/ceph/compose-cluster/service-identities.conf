# Platform service identities for the disposable developer cluster.
#
# Format, one identity per line:
#   <rgw-uid> | <display name> | <bucket>:rw [<bucket>:rw ...]
#
# ceph-compose-provision-service-identities.sh reads this file, generates
# disposable credentials into the ignored .env (CEPH_<UID>_ACCESS_KEY and
# CEPH_<UID>_SECRET_KEY, uppercased with hyphens as underscores), creates
# each RGW user, and applies one merged bucket policy per bucket covering
# every identity granted on it. rw grants list/get/put/delete and multipart.
#
# DEVELOPER HARNESS ONLY. In production, service identities and their
# secrets are provisioned through the approved identity and
# secret-management process (ceph_storage.md production track, P1-1.4-P1);
# nothing works from a flat file and secrets never land in an env file.
#
# The authoritative access matrix is ceph_storage.md section 4
# ("Service identity contract"); keep this file consistent with it.

svc-polaris | Stratus Polaris catalog service | stratus-landing:rw stratus-bronze:rw stratus-silver:rw stratus-gold:rw stratus-platform:rw
