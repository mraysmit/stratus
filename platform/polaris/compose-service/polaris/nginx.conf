events {}

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:polaris_tls:4m;
    ssl_session_timeout 1h;

    # One catalog container, so there is nothing to fail over to and no
    # passive health checking to configure. Unlike the Ceph RGW pool, a
    # failure here has no second server to try.
    upstream polaris_catalog {
        server polaris:8181;
    }

    server {
        listen 8181 ssl;
        server_name polaris.stratus.local localhost;

        # Iceberg clients send table metadata and commit payloads through
        # this proxy; the default 1m body limit would refuse a large commit.
        client_max_body_size 0;

        # Catalog commits can wait on object-store round trips, so the
        # upstream timeouts are generous rather than the nginx defaults.
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Polaris builds absolute URLs in OAuth and catalog responses; without
        # this it would advertise http:// and send clients back off TLS.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  8181;
        proxy_pass_request_headers on;

        location / {
            proxy_pass http://polaris_catalog;
        }
    }
}
